kind: M
api_version: v1beta3
metadata:
  display_name: Download Open CEDA Data
  name: data-bridge-noauth
  summary: Download open CEDA datasets without authentication.
  type: model
  publisher: DAFNI
  contact_point_name: DAFNI
  contact_point_email: info@dafni.ac.uk
  project_name: DAFNI Data Bridge
  project_url: https://github.com/dafnifacility/dataset-download-tool
  licence: MIT
  source_code: https://github.com/dafnifacility/dataset-download-tool
  description: >
    DAFNI Data Bridge – software for downloading data from CEDA and JWS. This software was developed in collaboration with the NERC Digital Solutions Engineering (DSE) team and the University of Manchester. To use this model user needs to provide the URL of the CEDA open dataset they wish to download. The model will then download the dataset and return it as an output.

spec:
  inputs:
    parameters:
      - name: ISDAFNI
        title: Running on DAFNI
        type: boolean
        default: True
        description: True or False
        required: True
      - name: CEDA_URL
        title: CEDA dataset URL
        type: string
        default: None
        description: URL of the CEDA dataset to download
        required: True
  outputs:
      datasets:
      - name: data
        type: dir
        description: downloaded files