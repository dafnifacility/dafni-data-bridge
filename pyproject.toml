[project]
name = "CEDA-Download-Tool"
version = "0.1.0"
description = "data federation tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.47",
    "cdsapi>=0.7.7",
    "ipykernel>=6.30.1",
    "moto[all,ec2,s3]>=5.1.21",
    "mypy-boto3-s3>=1.42.37",
    "pre-commit>=4.5.1",
    "pyftpdlib>=2.2.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.1",
]

[tool.ruff]
lint.select = ["E", "F", "I"]
line-length = 120
exclude = [
    "notebooks"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
