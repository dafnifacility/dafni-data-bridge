[project]
name = "dataset-download-tool"
authors = [{name="Muhammad Mohsin", email="muhammad.mohsin@stfc.ac.uk"},]
version = "0.1.4"
description = "Download tool to install datasets from CEDA/JASMIN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.29.0",
    "boto3>=1.42.47",
    "bs4>=0.0.2",
    "cdsapi>=0.7.7",
    "paramiko>=4.0.0",
    "s3cmd>=2.4.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-print-site-plugin>=2.6.0",
]
dev = [
    "mypy-boto3-s3>=1.42.37",
    "ipykernel>=6.30.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.1",
]
tests = [
    "pyftpdlib>=2.2.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "requests-mock>=1.12.1",
    "moto[s3,ec2]>=5.1.21",    
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "pytest-httpserver>=1.1.5",
]

[tool.ruff]
lint.select = ["E", "F", "I"]
line-length = 120
exclude = [
    "notebooks"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["dataset_download_tool"]

[tool.uv.build-backend]
module-name = "dataset_download_tool"
module-root = ""

[tool.uv.workspace]
members = [
    "api-example",
]

[project.scripts]
dataset-download-tool = "dataset_download_tool.cli.main:main"
ddt = "dataset_download_tool.cli.main:main"
