site_name: Dataset Download Tool
site_description: A unified CLI tool for downloading datasets from CEDA/JASMIN via HTTP, FTP, and SSH with S3 upload support
repo_url: https://github.com/dafnifacility/dataset-download-tool
repo_name: dafnifacility/dataset-download-tool

dev_addr: '0.0.0.0:8000'

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

watch:
  - docs
  - dataset_download_tool

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Installation: user-guide/installation.md
    - CLI Reference: user-guide/cli-reference.md
    - DAFNI Integration: user-guide/dafni-integration.md
  - Developer Guide:
    - Development Setup: developer-guide/setup.md
    - Architecture: developer-guide/architecture.md
    - Design: developer-guide/design.md
    - Extending the Tool: developer-guide/extending.md
    - Testing: developer-guide/testing.md
  - API Reference:
    - CLI Module: reference/cli.md
    - Transport Layer: reference/transport.md
    - Downloader: reference/downloader.md
    - Exceptions: reference/exceptions.md
